    <style>
      :root {
        --bg: #0b0d10;
        --surface: #15181d;
        --surface-border: rgba(255, 255, 255, 0.08);
        --text: #edeef0;
        --text-dim: #9aa1ab;
        --text-faint: #9099a8;
        --accent: #38bdf8;
        --accent-deep: #2563eb;
        --font-body: -apple-system, "Inter", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      /* z-index above the sub-composition mounts (root-level siblings placed
         later in the DOM): scene sections must paint their own overlay
         content (headline, store-card chrome) ABOVE the full-bleed mounted
         sub-composition's own opaque background, even though the mounts
         appear later in source order. Layering here is z-index, not
         data-track-index — track-index is a Studio display lane only and
         the render paints strictly in DOM order without it. */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
      }

      /* ============ shared scene chrome ============ */
      .scene-bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }

      .scene-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ============ SCENE 1: the problem ============ */
      #scene1-mockwin {
        width: 640px;
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.65);
        overflow: hidden;
        will-change: transform;
      }

      .s1-titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--surface-border);
        background: rgba(255, 255, 255, 0.015);
      }

      .s1-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .s1-dot.red {
        background: #ff5f57;
      }
      .s1-dot.yellow {
        background: #febc2e;
      }
      .s1-dot.green {
        background: #28c840;
      }
      .s1-titlebar .s1-label {
        margin-left: 8px;
        font-size: 13px;
        color: var(--text-faint);
      }

      .s1-body {
        padding: 32px 30px 34px;
      }

      .s1-field-label {
        display: block;
        font-size: 13px;
        color: var(--text-faint);
        margin-bottom: 10px;
      }

      #scene1-field {
        background: #111418;
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        padding: 16px 18px;
        font-size: 16px;
        min-height: 52px;
        display: flex;
        align-items: center;
        color: var(--text-dim);
        position: relative;
      }

      #scene1-field.blocked {
        border-color: rgba(248, 113, 113, 0.55);
      }

      #scene1-blocked-icon {
        position: absolute;
        right: 16px;
        top: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(248, 113, 113, 0.14);
        color: #f87171;
        opacity: 0;
        will-change: transform, opacity;
      }
      #scene1-blocked-icon svg {
        width: 14px;
        height: 14px;
        display: block;
      }

      #scene1-cursor {
        position: absolute;
        width: 22px;
        height: 22px;
        pointer-events: none;
        will-change: transform, opacity;
      }
      #scene1-cursor svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }

      #scene1-line {
        text-align: center;
        margin-top: 30px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
        opacity: 0;
        will-change: transform, opacity;
      }

      #scene1-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ============ SCENE 2: install ============ */
      /* Card is absolutely positioned (not flex-centered) so its button-well
         lands at a KNOWN percent of the 1920x1080 frame — press-ripple mounts
         full-bleed on top (as a root-level sibling, see mounts section below)
         and targets that same point via target_x/target_y. */
      /* Card ends BEFORE the button-well so its opaque box never covers the
         press-ripple pill mounted underneath (z-index 1) — the pill sits in
         the gap just below the card's bottom edge, not overlapping it. */
      #scene2-card {
        position: absolute;
        left: 50%;
        top: 366px;
        width: 620px;
        transform: translateX(-50%);
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.65);
        padding: 40px 44px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        will-change: transform, opacity;
      }

      #scene2-icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.5);
      }
      #scene2-icon img {
        width: 100%;
        height: 100%;
        display: block;
      }

      #scene2-name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.015em;
        margin-bottom: 8px;
        color: var(--text);
      }

      #scene2-store-meta {
        font-size: 14px;
        color: var(--text-faint);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #scene2-stars {
        color: #febc2e;
        letter-spacing: 1px;
      }

      #scene2-headline {
        position: absolute;
        top: 96px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 40px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: var(--text);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ============ SCENE 3: trigger ============ */
      #scene3-headline {
        position: absolute;
        top: 110px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 40px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: var(--text);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ============ SCENE 4: watch it type ============ */
      #scene4-card {
        width: 720px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        box-shadow: 0 44px 100px -32px rgba(0, 0, 0, 0.68);
        overflow: hidden;
        will-change: transform, opacity;
      }

      .s4-titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 15px 20px;
        border-bottom: 1px solid var(--surface-border);
        background: rgba(255, 255, 255, 0.015);
      }
      .s4-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .s4-dot.red {
        background: #ff5f57;
      }
      .s4-dot.yellow {
        background: #febc2e;
      }
      .s4-dot.green {
        background: #28c840;
      }
      .s4-titlebar .s4-label {
        margin-left: 8px;
        font-size: 14px;
        color: var(--text-faint);
      }

      .s4-body {
        padding: 36px 34px 38px;
      }

      .s4-field-label {
        display: block;
        font-size: 14px;
        color: var(--text-faint);
        margin-bottom: 12px;
      }

      #scene4-field {
        background: #111418;
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        padding: 20px 22px;
        font-size: 19px;
        min-height: 68px;
        display: flex;
        align-items: center;
        color: var(--text);
        font-family: var(--font-mono);
        letter-spacing: 0.02em;
      }

      #scene4-caret {
        display: inline-block;
        width: 3px;
        height: 1.15em;
        background: var(--accent);
        margin-left: 2px;
        vertical-align: text-bottom;
        will-change: opacity;
      }

      .s4-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 14px;
        color: var(--text-faint);
      }

      .s4-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #scene4-pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        will-change: transform, opacity;
      }

      #scene4-status-text {
        color: var(--text-dim);

      #scene4-status-text.success {
        color: var(--accent);
        font-weight: 600;
      }

      #scene4-count {
        font-family: var(--font-mono);
      }
    </style>

    <script>
      (function () {
        "use strict";

        var tl = gsap.timeline({ paused: true });

        /* ===================================================== */
        /* SCENE 1 — The problem (global 0s - 3s)                  */
        /* ===================================================== */
        var S1 = 0;
        var field = document.getElementById("scene1-field");
        var cursor = document.getElementById("scene1-cursor");
        var blockedIcon = document.getElementById("scene1-blocked-icon");
        var mockwin = document.getElementById("scene1-mockwin");
        var line = document.getElementById("scene1-line");

        // Position the cursor's rest state (mid-right of the field, before drag-in).
        gsap.set(cursor, { x: 520, y: -40, opacity: 0 });
        gsap.set(blockedIcon, { xPercent: 50, yPercent: -50, opacity: 0, scale: 0.6 });
        gsap.set(mockwin, { x: 0, y: 0 });
        gsap.set(line, { opacity: 0, y: 10 });

        // Cursor drags in toward the field (paste gesture attempt).
        tl.fromTo(
          cursor,
          { x: 620, y: 40, opacity: 0 },
          { x: 430, y: 4, opacity: 1, duration: 0.45, ease: "power2.out" },
          S1 + 0.15,
        );

        // Paste blocked: brief shake on the mock window + blocked icon flash.
        tl.to(mockwin, { x: -8, duration: 0.06, ease: "power1.inOut" }, S1 + 0.62);
        tl.to(mockwin, { x: 8, duration: 0.06, ease: "power1.inOut" }, S1 + 0.68);
        tl.to(mockwin, { x: -6, duration: 0.06, ease: "power1.inOut" }, S1 + 0.74);
        tl.to(mockwin, { x: 4, duration: 0.06, ease: "power1.inOut" }, S1 + 0.8);
        tl.to(mockwin, { x: 0, duration: 0.08, ease: "power2.out" }, S1 + 0.87);
        tl.set(field, { className: "blocked" }, S1 + 0.62);

        tl.fromTo(
          blockedIcon,
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" },
          S1 + 0.62,
        );
        tl.to(blockedIcon, { opacity: 0, duration: 0.3, ease: "power1.in" }, S1 + 1.5);

        // Cursor retreats off-stage after the block registers.
        tl.fromTo(
          cursor,
          { x: 430, y: 4, opacity: 1 },
          { x: 560, y: -50, opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false },
          S1 + 1.0,
        );

        // Problem line fades in below.
        tl.fromTo(
          line,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          S1 + 1.55,
        );

        /* ===================================================== */
        /* SCENE 2 — Install (global 3s - 6s)                       */
        /* ===================================================== */
        var S2 = 3;
        var card2 = document.getElementById("scene2-card");
        var headline2 = document.getElementById("scene2-headline");

        tl.fromTo(
          card2,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          S2 + 0.05,
        );

        // Headline appears after the press lands (press_at 1.8 -> global 4.8s).
        tl.fromTo(
          headline2,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          S2 + 2.15,
        );

        /* ===================================================== */
        /* SCENE 3 — Trigger it your way (global 6s - 10.5s)        */
        /* ===================================================== */
        var S3 = 6;
        var headline3 = document.getElementById("scene3-headline");

        tl.fromTo(
          headline3,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          S3 + 0.1,
        );

        /* ===================================================== */
        /* SCENE 4 — Watch it type (global 10.5s - 16.5s) — centerpiece */
        /* Deterministic chars-at-time table (typed-prompt law):     */
        /* built synchronously before the timeline registers.        */
        /* ===================================================== */
        var S4 = 10.5;
        var card4 = document.getElementById("scene4-card");
        var typedEl = document.getElementById("scene4-typed");
        var caretEl = document.getElementById("scene4-caret");
        var pulseEl = document.getElementById("scene4-pulse");
        var statusEl = document.getElementById("scene4-status-text");
        var countEl = document.getElementById("scene4-count");

        var DEMO_TEXT = "WELCOME-2K9F-XQ7Z";
        var TOTAL = DEMO_TEXT.length;

        // Fixed-seed LCG for human-feeling per-character delays (deterministic).
        var lcgState = 0x9e3779b1;
        function rnd() {
          lcgState = (Math.imul(1664525, lcgState) + 1013904223) >>> 0;
          return lcgState / 4294967296;
        }

        var CARD_IN = 0.5;
        var TYPE_START = 0.85;
        var CHAR_MIN = 0.085;
        var CHAR_MAX = 0.155;

        // Build the chars-at-time row table once (typed-prompt law).
        var rows = [{ t: 0, n: 0 }];
        (function buildRows() {
          var t = TYPE_START;
          for (var i = 1; i <= TOTAL; i += 1) {
            t += CHAR_MIN + rnd() * (CHAR_MAX - CHAR_MIN);
            rows.push({ t: t, n: i });
          }
        })();
        var typeEnd = rows[rows.length - 1].t;
        function charsAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].n;
          }
          return 0;
        }
        function showChars(n) {
          typedEl.textContent = DEMO_TEXT.slice(0, n);
          countEl.textContent = n + " / " + TOTAL;
        }

        gsap.set(card4, { opacity: 0, y: 24 });
        showChars(0);
        gsap.set(statusEl, { className: "" });
        statusEl.textContent = "Typing character by character…";

        tl.to(card4, { opacity: 1, y: 0, duration: CARD_IN, ease: "power3.out" }, S4);

        // Typing driver: onUpdate reads the pre-built row table (seek-safe).
        var typeDriver = { t: 0 };
        tl.to(
          typeDriver,
          {
            t: typeEnd,
            duration: typeEnd,
            ease: "none",
            onUpdate: function () {
              showChars(charsAt(typeDriver.t));
            },
          },
          S4,
        );

        // Caret: deterministic integer-cycle blink across the typing window,
        // then solid, matching the row-table driven approach used by
        // code-terminal-run (adapted for a plain form field, no terminal chrome).
        var caretCycles = Math.max(1, Math.round(typeEnd / 0.5));
        var caretDriver = { p: 0 };
        tl.to(
          caretDriver,
          {
            p: Math.PI * 2 * caretCycles,
            duration: typeEnd,
            ease: "none",
            onUpdate: function () {
              caretEl.style.opacity = Math.sin(caretDriver.p) >= 0 ? "1" : "0";
            },
          },
          S4 + TYPE_START,
        );
        tl.set(caretEl, { opacity: 1 }, S4 + TYPE_START);

        // Pulse dot: finite repeat count while "Typing..." status is active.
        var pulseCycle = 1.1;
        var pulseRepeats = Math.max(0, Math.floor(typeEnd / pulseCycle) - 1);
        tl.fromTo(
          pulseEl,
          { scale: 1, opacity: 1 },
          {
            scale: 1.6,
            opacity: 0.5,
            duration: pulseCycle / 2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: pulseRepeats * 2 + 1,
          },
          S4 + TYPE_START,
        );

        // Completion: status flips to "Typed successfully" in accent color.
        var successAt = S4 + typeEnd + 0.18;
        tl.set(caretEl, { opacity: 0 }, successAt - 0.02);
        tl.set(pulseEl, { scale: 1, opacity: 1 }, successAt - 0.02);
        tl.call(
          function () {
            statusEl.textContent = "Typed successfully";
            statusEl.className = "success";
          },
          null,
          successAt,
        );
        tl.fromTo(
          statusEl,
          { opacity: 0.4 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          successAt,
        );
        tl.fromTo(
          pulseEl,
          { scale: 0.6, opacity: 0.4 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" },
          successAt,
        );

        /* ===================================================== */
        /* Music bed: fade in ~1s at start, fade out ~1.5s under    */
        /* the outro so the CTA lockup lands in near-silence.       */
        /* ===================================================== */
        var musicBed = document.getElementById("music-bed");
        var BASE_VOLUME = 0.22;
        gsap.set(musicBed, { volume: 0 });
        tl.to(musicBed, { volume: BASE_VOLUME, duration: 1.0, ease: "sine.out" }, 0);
        tl.to(musicBed, { volume: 0, duration: 1.5, ease: "sine.in" }, 19.0);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
