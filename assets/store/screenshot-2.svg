<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <rect width="1280" height="800" fill="#F5F7FA"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2933">
    <g text-anchor="middle">
      <text x="640" y="88" font-size="46" font-weight="700">Start it the way you like</text>
      <text x="640" y="136" font-size="24" fill="#52606D">Copy your text, click a field, then use one of these.</text>
    </g>

    <g fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2">
      <rect x="70" y="200" width="360" height="460" rx="16"/>
      <rect x="460" y="200" width="360" height="460" rx="16"/>
      <rect x="850" y="200" width="360" height="460" rx="16"/>
    </g>

    <rect x="100" y="280" width="300" height="88" rx="44" fill="#E4E7EB"/>
    <g transform="translate(218 292) scale(.5)" fill="#FFFFFF" stroke="#1F2933" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="22" width="84" height="98" rx="14"/>
      <rect x="44" y="8" width="40" height="28" rx="8"/>
      <path d="M44 64H84M44 90H68" fill="none"/>
    </g>
    <path d="M272 340v34l9-8 6 14 7-3-6-14h12Z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <text x="100" y="510" font-size="30" font-weight="700">Toolbar icon</text>
    <g font-size="20" fill="#52606D">
      <text x="100" y="552">Click the icon to start</text>
      <text x="100" y="582">typing in the active field.</text>
    </g>

    <g fill="#F5F7FA" stroke="#1F2933" stroke-width="2.5">
      <rect x="490" y="292" width="96" height="64" rx="10"/>
      <rect x="600" y="292" width="110" height="64" rx="10"/>
      <rect x="724" y="292" width="66" height="64" rx="10"/>
    </g>
    <g font-size="24" font-weight="700" text-anchor="middle">
      <text x="538" y="333">Cmd</text>
      <text x="655" y="333">Shift</text>
      <text x="757" y="333">V</text>
    </g>
    <text x="490" y="510" font-size="30" font-weight="700">Keyboard shortcut</text>
    <g font-size="20" fill="#52606D">
      <text x="490" y="552">Cmd+Shift+V on macOS</text>
      <text x="490" y="582">Ctrl+Shift+V on Windows/Linux</text>
      <text x="490" y="612">You can change the shortcut.</text>
    </g>

    <rect x="880" y="262" width="300" height="152" rx="10" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
    <g font-size="22">
      <text x="904" y="301">Cut</text>
      <text x="904" y="347">Paste</text>
    </g>
    <rect x="888" y="362" width="284" height="44" rx="6"/>
    <text x="904" y="392" font-size="22" font-weight="700" fill="#FFFFFF">Paste as Typing</text>
    <text x="880" y="510" font-size="30" font-weight="700">Right-click menu</text>
    <g font-size="20" fill="#52606D">
      <text x="880" y="552">Right-click a field and select</text>
      <text x="880" y="582">Paste as Typing.</text>
    </g>

    <text x="640" y="726" font-size="24" fill="#52606D" text-anchor="middle">Start it again while it types to stop.</text>
  </g>
</svg>
